name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "ship" to confirm production deploy'
        required: true

permissions:
  contents: write

# A double-click or a quick re-trigger shouldn't start two parallel prod
# deploys. `cancel-in-progress: false` queues the second run instead of
# killing the first mid-rollout — aborting a flyctl deploy halfway through
# is exactly how you leave prod in a split state.
concurrency:
  group: prod-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.confirm == 'ship'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Build, typecheck, and smoke-test image
        uses: ./.github/actions/build-and-check
        with:
          # Empty so the client bundle issues relative `/api/...` requests.
          # Cloudflare Pages proxies `/api/*` to the prod Fly app via the
          # _redirects file written below. Once prod moves to a custom
          # domain (`api.quarzo.shop`) sharing eTLD+1 with the frontend,
          # set this to that absolute URL and delete the proxy step —
          # see docs/tech-roadmap.md Phase 7.
          vite-api-base-url: ""

      - name: Migrate production DB
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
        run: pnpm --filter server exec prisma migrate deploy

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy API to Fly prod
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl secrets set -a ${{ secrets.FLY_APP_PROD }} \
            DATABASE_URL="${{ secrets.DATABASE_URL_PROD }}" \
            JWT_SECRET="${{ secrets.JWT_SECRET_PROD }}" \
            ADMIN_EMAIL="${{ secrets.ADMIN_EMAIL_PROD }}" \
            ADMIN_PASSWORD="${{ secrets.ADMIN_PASSWORD_PROD }}" \
            CLIENT_ORIGIN="${{ secrets.CLIENT_ORIGIN_PROD }}" \
            COOKIE_DOMAIN="${{ secrets.COOKIE_DOMAIN_PROD }}" \
            APP_ENV="production" \
            NODE_ENV="production"
          flyctl deploy -a ${{ secrets.FLY_APP_PROD }} -c fly.toml --remote-only

      # Same-origin proxy at the Pages edge via a Cloudflare Pages Worker
      # (advanced mode): keeps the auth cookie first-party in every browser
      # (iOS Safari ITP rejects cross-site SameSite=None cookies). The
      # Worker preserves method, headers, and body — `_redirects` 200 rewrites
      # cannot reverse-proxy POST bodies to an external origin (405), and a
      # `functions/` directory placed inside the upload dir is not picked up
      # by the wrangler direct-upload path used by `pages-action@v1`.
      # `_worker.js` at the root of the uploaded `dist` is Cloudflare's
      # documented "advanced mode" and is picked up unconditionally.
      # Remove this step once prod moves behind a shared-eTLD+1 custom
      # domain — see docs/tech-roadmap.md Phase 7.
      - name: Generate Cloudflare Pages _worker.js (api proxy + SPA fallback)
        env:
          API_ORIGIN: ${{ secrets.FLY_APP_PROD }}.fly.dev
        run: |
          cat > 'client/dist/_worker.js' <<EOF
          export default {
            async fetch(request, env) {
              const url = new URL(request.url);

              if (url.pathname.startsWith("/api/")) {
                const target = "https://${API_ORIGIN}" + url.pathname + url.search;
                const init = {
                  method: request.method,
                  headers: request.headers,
                  redirect: "manual",
                };
                if (request.method !== "GET" && request.method !== "HEAD") {
                  init.body = request.body;
                }
                return fetch(target, init);
              }

              const assetResponse = await env.ASSETS.fetch(request);
              if (assetResponse.status !== 404) return assetResponse;

              const indexUrl = new URL("/index.html", url.origin);
              return env.ASSETS.fetch(new Request(indexUrl, request));
            },
          };
          EOF

      - name: Deploy client to Cloudflare Pages (prod)
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_PROD }}
          directory: client/dist
          branch: main

      - name: Tag release
        run: |
          TAG="release-$(date -u +%Y%m%d-%H%M)"
          git tag "$TAG"
          git push origin "$TAG"
