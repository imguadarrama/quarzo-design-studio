name: Deploy Staging

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
      - '.editorconfig'
      - '.gitattributes'

concurrency:
  group: staging-pr-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  deploy:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Resolve per-PR app name
        id: fly
        run: echo "app=${{ secrets.FLY_APP_STAGING }}-pr-${{ github.event.number }}" >> "$GITHUB_OUTPUT"

      - name: Create Neon branch
        id: neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID_STAGING }}
          branch_name: pr-${{ github.event.number }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Build, typecheck, and smoke-test image
        uses: ./.github/actions/build-and-check
        with:
          # Empty so the client bundle issues relative `/api/...` requests.
          # Cloudflare Pages then proxies `/api/*` to the per-PR Fly app via
          # the _redirects file written below — keeping the browser on a
          # single origin so the auth cookie stays first-party (Safari ITP
          # rejects cross-site SameSite=None cookies).
          vite-api-base-url: ""

      - name: Run migrations on PR branch
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL_STAGING }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD_STAGING }}
        run: |
          pnpm --filter server exec prisma migrate deploy
          pnpm --filter server seed

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Ensure Fly app exists
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if ! flyctl status -a ${{ steps.fly.outputs.app }} >/dev/null 2>&1; then
            flyctl apps create ${{ steps.fly.outputs.app }} --org ${{ secrets.FLY_ORG_STAGING }}
          fi

      - name: Deploy API to Fly staging
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl secrets set -a ${{ steps.fly.outputs.app }} \
            DATABASE_URL="${{ steps.neon.outputs.db_url_pooled }}" \
            JWT_SECRET="${{ secrets.JWT_SECRET_STAGING }}" \
            ADMIN_EMAIL="${{ secrets.ADMIN_EMAIL_STAGING }}" \
            ADMIN_PASSWORD="${{ secrets.ADMIN_PASSWORD_STAGING }}" \
            CLIENT_ORIGIN="${{ secrets.CLIENT_ORIGIN_STAGING }}" \
            CLIENT_ORIGIN_PREVIEW_PATTERN="${{ secrets.CLIENT_ORIGIN_PREVIEW_PATTERN_STAGING }}" \
            COOKIE_DOMAIN="" \
            APP_ENV="staging" \
            NODE_ENV="production"
          flyctl deploy -a ${{ steps.fly.outputs.app }} -c fly.staging.toml --remote-only

      # Same-origin proxy via a Cloudflare Pages Worker (advanced mode):
      # requests to pr-<N>.<project>.pages.dev/api/* are forwarded at the
      # edge to the per-PR Fly app, preserving method, headers, and body.
      # Set-Cookie from Fly flows back under the Pages hostname so the auth
      # cookie is first-party in every browser, including iOS Safari.
      #
      # Why _worker.js and not `functions/[[path]].js`: the wrangler-based
      # direct upload (`cloudflare/pages-action@v1`) does not bundle a
      # `functions/` directory placed inside the upload dir, so the route
      # never registers and `/api/*` falls through to static-asset serving
      # (POST → 405; GET → SPA NotFound). `_worker.js` at the root of the
      # uploaded `dist` is Cloudflare's documented "advanced mode" and is
      # picked up unconditionally.
      #
      # Why not `_redirects` 200: it cannot reverse-proxy POST/PUT/DELETE
      # bodies to an external origin — the body gets dropped or the method
      # downgraded, which surfaces as 405 at Fly.
      #
      # Long-term this whole step disappears once we move to a shared-
      # eTLD+1 custom domain — see docs/tech-roadmap.md Phase 7.
      - name: Generate Cloudflare Pages _worker.js (api proxy + SPA fallback)
        env:
          API_ORIGIN: ${{ steps.fly.outputs.app }}.fly.dev
        run: |
          cat > 'client/dist/_worker.js' <<EOF
          export default {
            async fetch(request, env) {
              const url = new URL(request.url);

              if (url.pathname.startsWith("/api/")) {
                const target = "https://${API_ORIGIN}" + url.pathname + url.search;
                const init = {
                  method: request.method,
                  headers: request.headers,
                  redirect: "manual",
                };
                if (request.method !== "GET" && request.method !== "HEAD") {
                  init.body = request.body;
                }
                return fetch(target, init);
              }

              const assetResponse = await env.ASSETS.fetch(request);
              if (assetResponse.status !== 404) return assetResponse;

              const indexUrl = new URL("/index.html", url.origin);
              return env.ASSETS.fetch(new Request(indexUrl, request));
            },
          };
          EOF

      - name: Deploy client to Cloudflare Pages (preview)
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_STAGING }}
          directory: client/dist
          branch: pr-${{ github.event.number }}

      # Sticky PR comment: one comment per PR, updated in place on every push.
      # Surfaces only the stable per-PR alias (`pr-<N>.<project>.pages.dev`) —
      # that URL always serves the latest build for this PR. Per-commit URLs
      # are still produced by Cloudflare for rollback, but we don't advertise them.
      - name: Upsert preview-URL comment on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: staging-preview
          message: |
            **Staging deployed**
            - Web: https://pr-${{ github.event.number }}.${{ secrets.CLOUDFLARE_PAGES_PROJECT_STAGING }}.pages.dev
            - API: https://${{ steps.fly.outputs.app }}.fly.dev/api/health

            _Updated automatically on every push to this PR._
