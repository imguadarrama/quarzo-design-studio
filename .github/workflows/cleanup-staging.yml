name: Cleanup Staging

on:
  pull_request:
    types: [closed]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
      - '.editorconfig'
      - '.gitattributes'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    # `FLY_APP_STAGING` is a staging-environment secret (see
    # docs/CI-CD/deploy-setup.md §4). Declaring the environment here
    # mirrors deploy-staging.yml so the secret resolves at job time.
    environment: staging
    steps:
      - uses: neondatabase/delete-branch-action@v3
        continue-on-error: true
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID_STAGING }}
          branch: pr-${{ github.event.number }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Destroy per-PR Fly app
        continue-on-error: true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl apps destroy ${{ secrets.FLY_APP_STAGING }}-pr-${{ github.event.number }} -y
