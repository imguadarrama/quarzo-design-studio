app = "quarzo-api"
primary_region = "qro"  # Querétaro — closest Fly region to Saltillo

[build]
  dockerfile = "server/Dockerfile"
  build-target = "runtime"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    protocol = "http"
    timeout = "5s"

# Pre-launch sizing. Prod is currently a demo URL for the client, not a
# serving workload — 256 MB keeps the app inside Fly's Hobby free
# allowance. Phase 7 in docs/tech-roadmap.md bumps this to 512 MB
# before public launch.
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
