name: Cleanup Staging

on:
  pull_request:
    types: [closed]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
      - '.editorconfig'
      - '.gitattributes'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    # `FLY_APP_STAGING` is a staging-environment secret (see
    # docs/CI-CD/deploy-setup.md §4). Declaring the environment here
    # mirrors deploy-staging.yml so the secret resolves at job time.
    environment: staging
    steps:
      - uses: neondatabase/delete-branch-action@v3
        continue-on-error: true
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID_STAGING }}
          branch: pr-${{ github.event.number }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Destroy per-PR Fly app
        continue-on-error: true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl apps destroy ${{ secrets.FLY_APP_STAGING }}-pr-${{ github.event.number }} -y

      # Delete every Cloudflare Pages preview deployment for this PR's branch.
      # Uses the same `Pages → Edit` token scope as the deploy workflow.
      # `?force=true` is required to delete the alias deployment (the one
      # currently serving `pr-<N>.<project>.pages.dev`).
      #
      # The list endpoint does NOT support `per_page` (returns 400 even though
      # the public REST docs imply it does — see
      # https://community.cloudflare.com/t/pages-deployments-api-doesnt-support-per-page-query-parameter/575193).
      # We page with `?page=N` until Cloudflare returns an empty result set.
      - name: Delete Cloudflare Pages preview deployments
        continue-on-error: true
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_STAGING }}
          PR_BRANCH: pr-${{ github.event.number }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$CF_PROJECT/deployments"

          ids=""
          page=1
          while :; do
            resp=$(curl -fsS -H "Authorization: Bearer $CF_API_TOKEN" \
              "$api?env=preview&page=$page")
            count=$(echo "$resp" | jq '.result | length')
            if [ "$count" -eq 0 ]; then
              break
            fi
            page_ids=$(echo "$resp" | jq -r --arg b "$PR_BRANCH" \
              '.result[] | select(.deployment_trigger.metadata.branch == $b) | .id')
            if [ -n "$page_ids" ]; then
              ids="${ids}${page_ids}"$'\n'
            fi
            page=$((page + 1))
          done

          ids=$(echo "$ids" | sed '/^$/d')
          if [ -z "$ids" ]; then
            echo "No Pages deployments found for branch $PR_BRANCH"
            exit 0
          fi

          for id in $ids; do
            echo "Deleting deployment $id"
            curl -fsS -X DELETE -H "Authorization: Bearer $CF_API_TOKEN" \
              "$api/$id?force=true" >/dev/null
          done
