app = "quarzo-api-staging"
primary_region = "qro"

[build]
  dockerfile = "server/Dockerfile"
  build-target = "runtime"

# Staging stays always-on (min_machines_running = 1, auto_stop = false).
# MercadoPago webhooks time out at ~15s but a cold Fly machine takes
# ~30s to wake — a sleeping staging would silently hide MP integration
# bugs. See docs/CI-CD/deploy-setup.md §1.
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    protocol = "http"
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
