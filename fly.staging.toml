app = "quarzo-api-staging"
primary_region = "dfw"  # qro (Querétaro) deprecated; dfw is next-closest to Saltillo

[build]
  dockerfile = "server/Dockerfile"
  build-target = "runtime"

# Runs in an ephemeral machine before any serving machine is updated. A
# non-zero exit aborts the deploy and leaves the current release in place.
# We load the Prisma singleton to catch missing generated-client bugs that
# no typecheck surfaces. Same gate as the CI docker smoke — belt and
# suspenders in case someone runs `flyctl deploy` by hand.
[deploy]
  release_command = "node scripts/smoke-prisma.mjs"
  strategy = "rolling"

# Scale to zero until Phase 4. The "staging stays always-on" rationale
# is sound — MercadoPago webhooks time out at ~15s but a cold Fly
# machine takes ~30s to wake, so a sleeping staging would silently hide
# MP integration bugs — but MP integration is Phase 4 and hasn't
# started. Paying for a 24/7 machine before then is wasted spend. When
# Phase 4 begins, flip these back to:
#   auto_stop_machines  = false
#   min_machines_running = 1
# See docs/CI-CD/deploy-setup.md §1.
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  # Tight grace_period + short interval so a boot failure surfaces during
  # the deploy rollout instead of showing up minutes later as random 502s.
  # The health route doesn't touch the DB, so 3s timeout is generous.
  [[http_service.checks]]
    grace_period = "5s"
    interval = "10s"
    method = "GET"
    path = "/api/health"
    protocol = "http"
    timeout = "3s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
