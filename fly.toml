app = "quarzo-api"
primary_region = "dfw"  # Dallas — closest still-active Fly region to Saltillo (qro was deprecated)

[build]
  dockerfile = "server/Dockerfile"
  build-target = "runtime"

# Runs in an ephemeral machine before any serving machine is updated. A
# non-zero exit aborts the deploy — no prod traffic is ever routed to a
# broken image. Mirrors the CI docker smoke; this is the last-line gate if
# CI is bypassed.
[deploy]
  release_command = "node scripts/smoke-prisma.mjs"
  strategy = "rolling"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  # See fly.staging.toml for rationale on the tight windows.
  [[http_service.checks]]
    grace_period = "5s"
    interval = "10s"
    method = "GET"
    path = "/api/health"
    protocol = "http"
    timeout = "3s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
