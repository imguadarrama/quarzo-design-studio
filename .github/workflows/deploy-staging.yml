name: Deploy Staging

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
      - '.editorconfig'
      - '.gitattributes'

concurrency:
  group: staging-pr-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  deploy:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Resolve per-PR app name
        id: fly
        run: echo "app=${{ secrets.FLY_APP_STAGING }}-pr-${{ github.event.number }}" >> "$GITHUB_OUTPUT"

      - name: Create Neon branch
        id: neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID_STAGING }}
          branch_name: pr-${{ github.event.number }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Pin DB URL to env
        run: echo "DATABASE_URL_POOLED=${{ steps.neon.outputs.db_url_pooled }}" >> "$GITHUB_ENV"

      - name: Build, typecheck, and smoke-test image
        uses: ./.github/actions/build-and-check
        with:
          # Empty so the client bundle issues relative `/api/...` requests.
          # Cloudflare Pages then proxies `/api/*` to the per-PR Fly app via
          # the _redirects file written below — keeping the browser on a
          # single origin so the auth cookie stays first-party (Safari ITP
          # rejects cross-site SameSite=None cookies).
          vite-api-base-url: ""

      - name: Run migrations on PR branch
        id: migrate
        continue-on-error: true
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_POOLED }}
        run: pnpm --filter server exec prisma migrate deploy

      # Auto-recover from divergent migration state on per-PR Neon branches.
      # Triggered when a PR rewrites/squashes a migration mid-flight and the
      # previously-applied migration is no longer on disk — Prisma marks the
      # new migration failed (P3009) and every subsequent push short-circuits.
      # The per-PR branch holds no real data, so wipe + recreate is safe.
      # Prod (deploy-production.yml) intentionally keeps Prisma's loud-fail.
      - name: Announce auto-recovery
        if: steps.migrate.outcome == 'failure'
        run: echo "::warning::migrate deploy failed on pr-${{ github.event.number }} Neon branch; resetting and retrying once."

      - name: Reset Neon branch (migrate failed)
        if: steps.migrate.outcome == 'failure'
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID_STAGING }}
          branch: pr-${{ github.event.number }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Recreate Neon branch
        id: neon_retry
        if: steps.migrate.outcome == 'failure'
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID_STAGING }}
          branch_name: pr-${{ github.event.number }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Pin recreated DB URL to env
        if: steps.migrate.outcome == 'failure'
        run: echo "DATABASE_URL_POOLED=${{ steps.neon_retry.outputs.db_url_pooled }}" >> "$GITHUB_ENV"

      - name: Retry migrations on fresh branch
        if: steps.migrate.outcome == 'failure'
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_POOLED }}
        run: pnpm --filter server exec prisma migrate deploy

      - name: Seed database
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_POOLED }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL_STAGING }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD_STAGING }}
        run: pnpm --filter server seed

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Ensure Fly app exists
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if ! flyctl status -a ${{ steps.fly.outputs.app }} >/dev/null 2>&1; then
            flyctl apps create ${{ steps.fly.outputs.app }} --org ${{ secrets.FLY_ORG_STAGING }}
          fi

      - name: Deploy API to Fly staging
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl secrets set -a ${{ steps.fly.outputs.app }} \
            DATABASE_URL="${{ env.DATABASE_URL_POOLED }}" \
            JWT_SECRET="${{ secrets.JWT_SECRET_STAGING }}" \
            ADMIN_EMAIL="${{ secrets.ADMIN_EMAIL_STAGING }}" \
            ADMIN_PASSWORD="${{ secrets.ADMIN_PASSWORD_STAGING }}" \
            CLIENT_ORIGIN="${{ secrets.CLIENT_ORIGIN_STAGING }}" \
            CLIENT_ORIGIN_PREVIEW_PATTERN="${{ secrets.CLIENT_ORIGIN_PREVIEW_PATTERN_STAGING }}" \
            COOKIE_DOMAIN="" \
            APP_ENV="staging" \
            NODE_ENV="production" \
            CLOUDFLARE_ACCOUNT_ID="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" \
            R2_ACCESS_KEY_ID="${{ secrets.R2_ACCESS_KEY_ID_STAGING }}" \
            R2_SECRET_ACCESS_KEY="${{ secrets.R2_SECRET_ACCESS_KEY_STAGING }}" \
            R2_BUCKET="${{ secrets.R2_BUCKET_STAGING }}" \
            R2_PUBLIC_BASE_URL="${{ secrets.R2_PUBLIC_BASE_URL_STAGING }}" \
            R2_KEY_PREFIX="pr-${{ github.event.number }}"
          flyctl deploy -a ${{ steps.fly.outputs.app }} -c fly.staging.toml --remote-only

      - name: Generate Cloudflare Pages _worker.js (api proxy + SPA fallback)
        uses: ./.github/actions/cf-pages-api-proxy
        with:
          api-origin: ${{ steps.fly.outputs.app }}.fly.dev

      - name: Deploy client to Cloudflare Pages (preview)
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_STAGING }}
          directory: client/dist
          branch: pr-${{ github.event.number }}

      # Sticky PR comment: one comment per PR, updated in place on every push.
      # Surfaces only the stable per-PR alias (`pr-<N>.<project>.pages.dev`) —
      # that URL always serves the latest build for this PR. Per-commit URLs
      # are still produced by Cloudflare for rollback, but we don't advertise them.
      - name: Upsert preview-URL comment on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: staging-preview
          message: |
            **Staging deployed**
            - Web: https://pr-${{ github.event.number }}.${{ secrets.CLOUDFLARE_PAGES_PROJECT_STAGING }}.pages.dev
            - API: https://${{ steps.fly.outputs.app }}.fly.dev/api/health

            _Updated automatically on every push to this PR._
