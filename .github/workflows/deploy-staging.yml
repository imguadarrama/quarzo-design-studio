name: Deploy Staging

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
      - '.editorconfig'
      - '.gitattributes'

concurrency:
  group: staging-pr-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  deploy:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      # Each PR gets its own Fly app so closing one PR can never affect another
      # (review-app pattern). Base name comes from FLY_APP_STAGING; the PR
      # number is appended. See docs/CI-CD/deploy-setup.md §6.
      - name: Resolve per-PR app name
        id: fly
        run: echo "app=${{ secrets.FLY_APP_STAGING }}-pr-${{ github.event.number }}" >> "$GITHUB_OUTPUT"

      - name: Create Neon branch
        id: neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID_STAGING }}
          branch_name: pr-${{ github.event.number }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Build, typecheck, and smoke-test image
        uses: ./.github/actions/build-and-check
        with:
          vite-api-base-url: https://${{ steps.fly.outputs.app }}.fly.dev

      - name: Run migrations on PR branch
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL_STAGING }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD_STAGING }}
        run: |
          pnpm --filter server exec prisma migrate deploy
          pnpm --filter server seed

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Idempotent: first deploy on a PR creates the app; subsequent pushes
      # short-circuit when `flyctl status` finds it. fly.staging.toml's
      # `app = "..."` line is overridden by the `-a` flag on deploy.
      - name: Ensure Fly app exists
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if ! flyctl status -a ${{ steps.fly.outputs.app }} >/dev/null 2>&1; then
            flyctl apps create ${{ steps.fly.outputs.app }} --org ${{ secrets.FLY_ORG_STAGING }}
          fi

      - name: Deploy API to Fly staging
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl secrets set -a ${{ steps.fly.outputs.app }} \
            DATABASE_URL="${{ steps.neon.outputs.db_url_pooled }}" \
            JWT_SECRET="${{ secrets.JWT_SECRET_STAGING }}" \
            ADMIN_EMAIL="${{ secrets.ADMIN_EMAIL_STAGING }}" \
            ADMIN_PASSWORD="${{ secrets.ADMIN_PASSWORD_STAGING }}" \
            CLIENT_ORIGIN="${{ secrets.CLIENT_ORIGIN_STAGING }}" \
            CLIENT_ORIGIN_PREVIEW_PATTERN="${{ secrets.CLIENT_ORIGIN_PREVIEW_PATTERN_STAGING }}" \
            COOKIE_DOMAIN="" \
            APP_ENV="staging" \
            NODE_ENV="production"
          flyctl deploy -a ${{ steps.fly.outputs.app }} -c fly.staging.toml --remote-only

      - name: Deploy client to Cloudflare Pages (preview)
        id: pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_STAGING }}
          directory: client/dist
          branch: pr-${{ github.event.number }}

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        env:
          PAGES_ALIAS: ${{ steps.pages.outputs.alias }}
          PAGES_URL: ${{ steps.pages.outputs.url }}
          FLY_APP: ${{ steps.fly.outputs.app }}
          CF_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_STAGING }}
        with:
          script: |
            const { PAGES_ALIAS, PAGES_URL, FLY_APP, CF_PROJECT } = process.env;
            const stable = PAGES_ALIAS || `https://pr-${context.issue.number}.${CF_PROJECT}.pages.dev`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                '**Staging deployed**',
                `- Web (stable, always latest): ${stable}`,
                `- Web (this commit): ${PAGES_URL}`,
                `- API: https://${FLY_APP}.fly.dev/api/health`,
              ].join('\n')
            })
