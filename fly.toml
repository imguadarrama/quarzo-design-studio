app = "quarzo-api"
primary_region = "dfw"  # Dallas — closest still-active Fly region to Saltillo (qro was deprecated)

[build]
  dockerfile = "server/Dockerfile"
  build-target = "runtime"

# Runs in an ephemeral machine before any serving machine is updated. A
# non-zero exit aborts the deploy — no prod traffic is ever routed to a
# broken image. Mirrors the CI docker smoke; this is the last-line gate if
# CI is bypassed.
[deploy]
  release_command = "node scripts/smoke-prisma.mjs"
  strategy = "rolling"

# Always-on: this prod app serves the public demo URL (quarzo.pages.dev)
# linked from the owner's resume, so one machine stays up to avoid the
# ~3–5s cold start a reviewer would otherwise hit on first click. The cost
# is ~$1.94/mo at the 256 MB tier below. Phase 7 in docs/tech-roadmap.md
# revisits full public-launch sizing (bump to 512 MB). See
# docs/CI-CD/deploy-setup.md §1.
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  # See fly.staging.toml for rationale on the tight windows.
  [[http_service.checks]]
    grace_period = "5s"
    interval = "10s"
    method = "GET"
    path = "/api/health"
    protocol = "http"
    timeout = "3s"

# Pre-launch sizing. Prod is currently a demo URL for the client, not a
# serving workload — 256 MB is the cheapest tier and is ample for browsing
# (RAM is crash-under-load headroom, not page speed). The one memory-hungry
# path is the Sharp image-upload pipeline; bump to 512 MB if admin uploads
# ever OOM the machine. Phase 7 in docs/tech-roadmap.md bumps this to 512 MB
# before public launch.
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
